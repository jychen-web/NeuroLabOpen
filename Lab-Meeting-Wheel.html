<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neuro Lab Meeting</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#173e37;background:#f4f7f3;font:16px/1.5 "Microsoft JhengHei",system-ui,sans-serif}header{height:70px;background:#163e36;color:#f2f4df;display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,22px)}header strong{font:600 23px Georgia,serif;display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;border:1px solid #c2d5bd;border-radius:50%;width:34px;height:34px;font:26px Georgia}header small{letter-spacing:.12em}main{max-width:1230px;margin:auto;padding:36px 4vw}h1{margin:0;font-size:clamp(30px,4vw,45px);letter-spacing:.035em}h2{font-size:20px;margin:0}.intro{margin:6px 0 25px;color:#577169}.layout{display:grid;grid-template-columns:1.16fr 1fr;gap:22px}.card{border:1px solid #ccd9cf;background:#fff;border-radius:19px;padding:24px}.stage{display:flex;flex-direction:column;align-items:center;background-color:#eaf1e9;background-image:radial-gradient(#a9bead80 .8px,transparent .9px);background-size:12px 12px}.head{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}.count{font-size:14px;background:#f8fbf3;border:1px solid #c5d4c6;padding:3px 11px;border-radius:18px}.wheelbox{width:min(100%,410px);position:relative;margin:16px 0 14px;filter:drop-shadow(0 5px 3px #163e3622)}svg{width:100%;display:block}.pointer{position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:22px;height:34px;background:#e48b66;clip-path:polygon(0 0,100% 0,50% 100%)}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #bd693c;outline-offset:2px}button:disabled{cursor:default;opacity:.55}#spin{border:0;border-radius:11px;background:#184d3f;color:white;font-weight:bold;font-size:19px;padding:13px;width:min(100%,340px)}#result{min-height:25px;margin:9px 0 0;text-align:center}.reset{border:0;background:transparent;color:#557267;font-size:14px;padding:6px}.tabs{display:flex;background:#edf2ec;border-radius:9px;padding:4px;margin:18px 0 10px}.tabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 0;font-size:14px}.tabs button[aria-pressed=true]{background:white;box-shadow:0 1px 5px #1d48331f;font-weight:bold}.list{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid #e5ebe4;padding:8px 0}.row b{font-size:16px}.row button{margin-left:auto;border:0;background:transparent;padding:2px 6px;font-size:18px;color:#5c786a}.sw{width:11px;height:11px;border-radius:3px;flex:none}.help{color:#65786f;font-size:14px;margin:13px 0 0}.empty{grid-column:1/-1;text-align:center;padding:30px;color:#62766b}@media(max-width:800px){.layout{grid-template-columns:1fr}.wheelbox{max-width:380px}main{padding:24px 16px}.card{padding:18px}}
.winner{display:block;font-size:clamp(3rem,6vw,5rem);font-weight:800;line-height:1.15;letter-spacing:.06em;margin-top:.15em}</style><header><strong><span class="logo">✳</span>Neuro Lab Meeting</strong><small>單機版</small></header><main><h1>發言接力</h1><p class="intro">轉動轉盤，選出下一位發言的同學。</p><div class="layout"><section class="card stage"><div class="head"><h2>抽籤轉盤</h2><span class="count" id="count">20 人待抽</span></div><div class="wheelbox"><svg viewBox="-210 -210 420 420" role="img" aria-label="待抽同學轉盤"><circle r="205" fill="#224c40"/><circle r="199" fill="#fbfbec"/><g id="sectors"></g><circle r="36" fill="#f8f8e9" stroke="#295646" stroke-width="3"/><g fill="none" stroke="#315845" stroke-width="3" stroke-linejoin="round"><path d="M-5-14h10m-8 0v10l-11 17q-2 4 3 4h22q5 0 3-4L3-4v-10M-8 7q4-4 8-1t7 0"/></g></svg><i class="pointer"></i></div><button id="spin" disabled>⟳　開始抽籤</button><p id="result" role="status"></p></section><section class="card"><div class="head"><h2>發言名單</h2><button class="reset" id="reset">↺　重設本輪</button></div><div class="tabs" id="tabs"></div><div class="list" id="list"></div><p class="help" id="help"></p></section></div></main><script>
const names=["陳靜圓","林俊廷","蘇楷涵","林怡瑄","李芸嬅","楊程","鄒昀珊","楊有朋","李穎","陳靖頤","謝宛儒","蔣蕙宇","李岳龍","蔡伃雅","張寄萱","劉建誠","吳柏韋","陳亮煒","林家妤","吳瑞雅"]
, colors=['#95b8a4','#f0ce9e','#8bb2ba','#e2a990','#c0cf99'];
let states={},tab=0,busy=false,ready=false,angle=0,serial=0;
const $=id=>document.getElementById(id), group=i=>names.filter(n=>(states[n]||0)===i), color=n=>colors[names.indexOf(n)%5];
function wheel(pool){
 const point=a=>[194*Math.cos(a),194*Math.sin(a)].join(' ');
 $('sectors').innerHTML=pool.map((n,i)=>{const a=(i-.5)*2*Math.PI/pool.length-Math.PI/2,b=a+2*Math.PI/pool.length,rot=i*360/pool.length-90;
 return (pool.length===1?'<circle r="194" fill="'+color(n)+'"/>':'<path d="M0 0 L'+point(a)+' A194 194 0 0 1 '+point(b)+'Z" stroke="#f4f4df" stroke-width="1.5" fill="'+color(n)+'"/>')+'<g transform="rotate('+rot+')"><text x="135" y="6" text-anchor="middle" font-size="17" font-weight="700" fill="#233f37" transform="rotate('+(rot>90&&rot<270?180:0)+' 135 0)">'+n+'</text></g>'}).join('');
}
function render(){const pool=group(0);wheel(pool);$('count').textContent=pool.length+' 人待抽';$('spin').disabled=!ready||busy||!pool.length;$('reset').disabled=!ready||busy;$('tabs').innerHTML=['待抽','已抽中','已發言'].map((s,i)=>'<button aria-pressed="'+(i===tab)+'" data-tab="'+i+'">'+s+' '+group(i).length+'</button>').join('');
 $('help').textContent=['按姓名旁的 ✓，可將已發言的同學移出轉盤。','按 ✓ 標記已發言，或按 ↺ 放回轉盤。','按 ↺ 可將同學放回轉盤。'][tab];
 $('list').innerHTML=group(tab).map(n=>'<div class="row"><i class="sw" style="background:'+color(n)+'"></i><b>'+n+'</b><span style="margin-left:auto">'+(tab!==2?btn(n,'done','✓','標記已發言'):'')+(tab!==0?btn(n,'restore','↺','放回轉盤'):'')+'</span></div>').join('')||'<p class="empty">此名單目前無人</p>';
}
function btn(n,a,s,t){return '<button '+(busy||!ready?'disabled':'')+' data-name="'+n+'" data-action="'+a+'" title="'+t+'" aria-label="'+n+' '+t+'">'+s+'</button>'}
let saved={};
async function api(data){
 try{saved=JSON.parse(localStorage.getItem('meeting-wheel-v1')||JSON.stringify(saved))}catch{}
 let winner=null;
 if(data){if(data.action==='draw'){const pool=names.filter(n=>!saved[n]);if(pool.length){winner=pool[Math.floor(Math.random()*pool.length)];saved[winner]=1}}
 else if(data.action==='reset')saved={};else saved[data.name]=data.action==='done'?2:0;
 try{localStorage.setItem('meeting-wheel-v1',JSON.stringify(saved))}catch{}}
 return {states:{...saved},winner};
}
async function sync(){if(busy)return;const id=++serial;try{const r=await api();if(id!==serial)return;states=r.states;ready=true;render()}catch{if(id===serial){ready=false;render();$('result').textContent='連線中斷，正在重新連線…'}}}
async function act(action,name){if(busy||!ready)return;busy=true;++serial;const pool=group(0);render();
 try{const r=await api({action,name});if(action==='draw'&&r.winner){if(!pool.includes(r.winner))pool.push(r.winner);wheel(pool);const target=(360-pool.indexOf(r.winner)*360/pool.length)%360;const next=angle+1080+(target-angle%360+360)%360;
 const g=$('sectors');const anim=g.animate([{transform:'rotate('+angle+'deg)'},{transform:'rotate('+next+'deg)'}],{duration:matchMedia('(prefers-reduced-motion: reduce)').matches?0:1900,easing:'cubic-bezier(.12,.7,.16,1)',fill:'forwards'});await anim.finished;await new Promise(res=>setTimeout(res,450));anim.cancel();angle=0;tab=1;const winner=document.createElement('strong');winner.className='winner';winner.textContent=r.winner;$('result').replaceChildren('本次抽中',winner);
 }else $('result').textContent=action==='reset'?'已開始新的一輪':action==='done'?name+' 已發言':action==='restore'?name+' 已放回轉盤':'待抽名單已空';if(action==='reset')tab=0;states=r.states}
 catch{$('result').textContent='連線失敗，請確認名單後再試。'}finally{busy=false;render();sync()}}
$('spin').onclick=()=>act('draw');$('reset').onclick=()=>{if(confirm('重新開始本輪，將 20 位同學全部放回轉盤？'))act('reset')};$('tabs').onclick=e=>{if(e.target.dataset.tab!==undefined){tab=Number(e.target.dataset.tab);render()}};$('list').onclick=e=>{if(e.target.dataset.action)act(e.target.dataset.action,e.target.dataset.name)};render();sync();setInterval(sync,2500);
</script></html>
